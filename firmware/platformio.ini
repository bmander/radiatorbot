; The radiator bot's firmware, for the Arduino Uno R4 Minima.
;
;     pio run -d firmware                  build
;     pio run -d firmware -t upload        build and flash over USB-C
;     pio device monitor -d firmware       the console
;
; The platform is PlatformIO's renesas-ra, pinned to a release (it brings the Arduino core for the
; R4, 1.6), so a build today is the build next year.  The core links newlib-nano, whose printf
; leaves out floats unless asked: the console prints currents and voltages.

[platformio]
default_envs = uno_r4_minima

[env:uno_r4_minima]
platform = platformio/renesas-ra@1.9.0
board = uno_r4_minima
framework = arduino
build_flags =
  -Wall
  -Wextra
  -Wl,-u,_printf_float
monitor_speed = 115200
