; The radiator bot's firmware, for the SparkFun IoT RedBoard ESP32 (WRL-19177).
;
;     pio run -d firmware                  build
;     pio run -d firmware -t upload        build and flash over USB-C
;     pio device monitor -d firmware       the console
;
; The platform is pioarduino's build of PlatformIO's espressif32, pinned to a release (it brings
; Espressif's Arduino core 3.3.12, on ESP-IDF 5.5), so a build today is the build next year.
; PlatformIO's own espressif32 stops at the Arduino core 2.0.17; pioarduino carries it on, and
; PlatformIO fetches it from the URL below like any other platform.

[platformio]
default_envs = redboard_esp32

[env:redboard_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = sparkfun_esp32_iot_redboard
framework = arduino
build_flags =
  -Wall
  -Wextra
monitor_speed = 115200
