; The radiator bot's firmware, for the Seeed XIAO ESP32-C3.
;
;     pio run -d firmware                  build
;     pio run -d firmware -t upload        build and flash over USB-C
;     pio device monitor -d firmware       the console
;
; The platform is pioarduino's, for the Arduino core 3.x (PlatformIO's own espressif32 platform
; stops at 2.x).  It's pinned to a release, so a build today is the build next year.

[platformio]
default_envs = xiao

[env:xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
build_flags =
  -Wall
  -Wextra
monitor_speed = 115200
