<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="19" text-anchor="start" fill="#1d1d1b" font-weight="700">Radiator bot: the shield&#8217;s wiring</text>
<text x="24" y="54" font-size="12.5" text-anchor="start" fill="#6b6a66" font-weight="400">SparkFun IoT RedBoard ESP32, Adafruit TB6612 (both bridges tied together), Adafruit INA219. Nothing on the shield touches 5 V.</text>
