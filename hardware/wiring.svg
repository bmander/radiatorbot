<text x="240" y="384.5" font-size="12.5" text-anchor="end" fill="#1d1d1b" font-weight="400">A1 · GPIO32</text>
<rect x="246" y="496" width="8" height="8" fill="#1d1d1b"/>
<text x="240" y="504.5" font-size="12.5" text-anchor="end" fill="#1d1d1b" font-weight="400">D3 · GPIO13</text>
