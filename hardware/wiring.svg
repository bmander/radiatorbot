<text x="140" y="74" font-size="15" text-anchor="middle" fill="#1d1d1b" font-weight="700">IoT RedBoard ESP32</text>
<text x="140" y="90" font-size="11.5" text-anchor="middle" fill="#6b6a66" font-weight="400">its Uno place, then its GPIO</text>
